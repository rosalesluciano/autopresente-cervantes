{% extends "base.html" %}
{% block cabeza %}
<style>
  body{background:#fff}
  .m-cab{background:var(--azul);color:#fff;padding:22px 20px 60px}
  .m-cab .marca{font-size:15px}
  .m-tarj{max-width:440px;margin:-40px auto 30px;background:#fff;border-radius:18px;box-shadow:var(--sombra);
    border:1px solid var(--azul-borde);padding:26px 22px;margin-left:16px;margin-right:16px}
  @media (min-width:480px){.m-tarj{margin-left:auto;margin-right:auto}}
  .m-tarj h1{font-size:22px}
  .icono{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:4px auto 14px;font-size:34px;font-weight:700}
  .icono.ok{background:var(--ok-suave);color:var(--ok)} .icono.err{background:var(--err-suave);color:var(--err)}
  .icono.azul{background:var(--azul-suave);color:var(--azul)}
  .centro{text-align:center}
  .btn.ancho{width:100%;padding:14px;font-size:16px;margin-top:16px}
  .spinner{width:34px;height:34px;border:4px solid var(--azul-suave);border-top-color:var(--azul);border-radius:50%;animation:gira 1s linear infinite;margin:auto}
  @keyframes gira{to{transform:rotate(360deg)}}
</style>
{% endblock %}
{% block barra %}<div class="m-cab"><span class="marca"><img class="logo" src="/static/icono-cervantes.png" alt="">Cervantes<span class="producto">AutoPresente</span></span></div>{% endblock %}
