<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantalla del aula · AutoPresente</title>
<link rel="icon" href="img/icono-cervantes.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  body{background:var(--azul);color:#fff;min-height:100vh}
  .kiosco{min-height:100vh;display:grid;grid-template-columns:minmax(300px,46vh) 1fr;gap:6vw;align-items:center;padding:6vh 7vw}
  .qr{background:#fff;border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .qr a{display:block}
  .qr svg{width:100%;height:auto;display:block}
  .rot{height:5px;background:var(--azul-suave);border-radius:4px;margin-top:16px;overflow:hidden}
  .rot i{display:block;height:100%;background:var(--azul);transition:width 1s linear}
  .rot-txt{color:var(--texto-3);font-size:13px;text-align:center;margin-top:8px}
  .eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:13px;opacity:.65;font-weight:600}
  .mat{font-size:clamp(32px,4.6vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:10px 0 6px}
  .hor{font-size:clamp(16px,1.6vw,22px);opacity:.8}
  .instr{margin:4vh 0;font-size:clamp(16px,1.5vw,21px);opacity:.92;max-width:34em}
  .contador{display:flex;align-items:baseline;gap:12px}
  .contador .n{font-size:clamp(48px,6vw,88px);font-weight:800;letter-spacing:-.04em;line-height:1}
  .contador .de{opacity:.6;font-size:20px}
  .ultimos{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
  .ultimos span{background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:6px 14px;font-size:15px}
  .espera{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px}
  .espera .h{font-size:clamp(60px,10vw,140px);font-weight:800;letter-spacing:-.04em}
  .sello{position:fixed;top:24px;right:28px;width:52px;height:52px;border-radius:50%;background:#fff;padding:3px}
  .pie{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:12px;opacity:.45}
  @media (max-width:760px){.kiosco{grid-template-columns:1fr;padding:80px 16px 50px}.pie{position:static;padding-bottom:16px}}
</style>
</head>
<body>
<img class="sello" src="img/icono-cervantes.png" alt="Cervantes">
<div id="raiz"></div>
<div class="pie" id="pie"></div>
<script src="js/comun.js"></script>
<script>
const aulaId = new URLSearchParams(location.search).get("aula") || "A-201";
const nombreAula = CONFIG.aulas[aulaId] || aulaId;
document.getElementById("pie").textContent = `Cervantes · AutoPresente · ${nombreAula} · registro automático de asistencia`;
let ultimoToken = "";
function ciclo(){
  const e = leer(), raiz = document.getElementById("raiz");
  const clase = e.clases.find(c => c.estado === "en_curso" && CONFIG.cursos[c.cursoId].aula === aulaId);
  if (!clase) {
    ultimoToken = "";
    raiz.innerHTML = `<div class="espera"><div><div class="eyebrow">${esc(nombreAula)}</div><div class="h">${horaTxt(new Date())}</div>
      <div style="opacity:.7">No hay clase en curso. El código aparece solo cuando empieza la próxima.</div>
      <p style="opacity:.55;font-size:14px">Demo: iniciá una clase desde el <a href="index.html" style="color:#fff">panel</a>.</p></div></div>`;
    return;
  }
  const curso = CONFIG.cursos[clase.cursoId];
  if (!document.getElementById("qr")) {
    raiz.innerHTML = `<div class="kiosco">
      <div><div class="qr"><a id="qr" target="_blank" title="Abrir el check-in en otra pestaña"></a><div class="rot"><i id="rot"></i></div>
        <div class="rot-txt">El código cambia cada ${CONFIG.reglas.rotacionQR} s</div></div></div>
      <div><div class="eyebrow">Registro de asistencia · ${esc(aulaId)}</div>
        <div class="mat">${esc(curso.materia)} · ${curso.division}</div>
        <div class="hor">${horaTxt(new Date(clase.inicio))} – ${horaTxt(new Date(clase.fin))} hs</div>
        <p class="instr">Escaneá el código con tu celular e ingresá con tu <b>cuenta institucional</b>. Listo: quedás presente.</p>
        <div class="contador"><span class="n" id="n">0</span><span class="de" id="de"></span></div>
        <div class="ultimos" id="ult"></div></div></div>`;
  }
  const token = tokenQR(clase.id);
  if (token !== ultimoToken) {
    const url = new URL(`checkin.html?c=${clase.id}&k=${clase.cursoId}&f=${clase.fin}&s=${canal()}&t=${token}`, location.href).href;
    const q = qrcode(0, "M"); q.addData(url); q.make();
    const a = document.getElementById("qr");
    a.innerHTML = q.createSvgTag({cellSize: 8, margin: 2, scalable: true}).replace(/fill="black"/g, 'fill="#2A3355"').replace(/fill="#000000"/g, 'fill="#2A3355"');
    a.href = url; ultimoToken = token;
  }
  const seg = CONFIG.reglas.rotacionQR, resto = seg - Math.floor(Date.now() / 1000) % seg;
  document.getElementById("rot").style.width = (100 * resto / seg) + "%";
  const lista = Object.entries(clase.checkins).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
  const pad = Object.fromEntries(padron(clase.cursoId).map(a => [a.matricula, a.nombre]));
  document.getElementById("n").textContent = lista.length;
  document.getElementById("de").textContent = `de ${Object.keys(pad).length} presentes en el aula`;
  document.getElementById("ult").innerHTML = lista.slice(0, 6).map(([m]) => `<span>✓ ${esc(nombrePila(pad[m]))}</span>`).join("");
}
escucharCheckins(ciclo);
ciclo(); setInterval(ciclo, 1000);
</script>
</body>
</html>
