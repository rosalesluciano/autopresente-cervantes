<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registrar asistencia · AutoPresente</title>
<link rel="icon" href="img/icono-cervantes.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=6">
<style>
  body{background:#fff}
  .m-cab{background:var(--azul);color:#fff;padding:22px 20px 60px}
  .m-cab .marca{font-size:15px}
  .m-tarj{max-width:440px;margin:-40px 16px 30px;background:#fff;border-radius:18px;box-shadow:var(--sombra);border:1px solid var(--azul-borde);padding:26px 22px}
  @media (min-width:480px){.m-tarj{margin-left:auto;margin-right:auto}}
  .m-tarj h1{font-size:22px}
  .icono{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:4px auto 14px;font-size:34px;font-weight:700}
  .icono.ok{background:var(--ok-suave);color:var(--ok)} .icono.err{background:var(--err-suave);color:var(--err)}
  .centro{text-align:center}
  .btn.ancho{width:100%;padding:14px;font-size:16px;margin-top:16px}
  .spinner{width:34px;height:34px;border:4px solid var(--azul-suave);border-top-color:var(--azul);border-radius:50%;animation:gira 1s linear infinite;margin:auto}
  @keyframes gira{to{transform:rotate(360deg)}}
  .logo-g{display:block;height:92px;margin:0 auto 8px}
</style>
</head>
<body>
<div class="m-cab"><span class="marca"><img class="logo" src="img/icono-cervantes.png" alt="">Cervantes<span class="producto">AutoPresente</span></span></div>
<div class="m-tarj" id="caja"></div>
<script src="js/comun.js?v=6"></script>
<script>
const p = new URLSearchParams(location.search), claseId = +p.get("c"), token = p.get("t"), w = +p.get("w");
const caja = document.getElementById("caja");
const finParam = +p.get("f") || null, topic = p.get("s");
// Misma computadora que la pantalla del aula: la clase está en este navegador.
const local = leer().clases.find(c => c.id === claseId && (!finParam || c.fin === finParam));
const cursoId = local ? local.cursoId : p.get("k");
const real = local ? !!local.real : p.get("m") === "r";

function error(titulo, msj){
  caja.className = "m-tarj centro";
  caja.innerHTML = `<div class="icono err">!</div><h1>${titulo}</h1><p class="sub">${msj}</p>`;
}
const MENSAJES = {
  vencido: ["Código vencido", "Pasaron más de 2 minutos desde que escaneaste. Volvé a escanear el código que está proyectado en el aula."],
  invalido: ["Código no válido", "Volvé a escanear el código que está proyectado en el aula."],
  cerrada: ["La clase terminó", "El registro presencial sólo está abierto mientras dura la clase."],
  dominio: ["Usá tu mail institucional", `El mail tiene que terminar en @${CONFIG.dominio}. Volvé a escanear el QR e ingresalo de nuevo.`],
  datos: ["Faltan datos", "Revisá tu nombre y tu matrícula (sólo números). Volvé a escanear el QR e intentá de nuevo."],
  no_padron: ["No figurás en el padrón", "Tu mail no está en el padrón de esta materia."],
  matricula_en_uso: ["Matrícula ya registrada", "Otra persona ya se registró con esa matrícula en esta clase. Revisá el número y volvé a escanear el QR."],
};

// Datos que el alumno ya escribió en este celular (para no tipearlos de nuevo en la próxima clase).
let guardados = {}; try { guardados = JSON.parse(localStorage.getItem("autopresente_alumno")) || {}; } catch {}

if (!CONFIG.cursos[cursoId] || !w || !token || (!local && !topic)) {
  error("Código desactualizado", "Este QR viene de una pantalla del aula con una versión vieja. En la computadora, recargá la pantalla del aula con Ctrl+F5 y volvé a escanear.");
} else if (local && local.estado !== "en_curso") {
  error(...MENSAJES.cerrada);
} else {
  const curso = CONFIG.cursos[cursoId], alumnos = padron(cursoId);
  const formReal = `
    <label for="nombre">Nombre y apellido</label><input id="nombre" autocomplete="name" value="${esc(guardados.nombre || "")}" placeholder="Ana Gómez">
    <label for="matricula">Matrícula</label><input id="matricula" inputmode="numeric" pattern="[0-9]*" value="${esc(guardados.matricula || "")}" placeholder="45123">
    <label for="email">Mail institucional</label><input id="email" type="email" autocomplete="email" value="${esc(guardados.email || "")}" placeholder="nombre.apellido@${CONFIG.dominio}">
    <p class="detalle" id="aviso" style="color:var(--err);min-height:1.2em;margin:6px 0 0"></p>`;
  const formDemo = `<label for="cuenta">Cuenta</label>
    <select id="cuenta">${alumnos.map(a => `<option value="${a.matricula}">${esc(a.nombre)} — ${a.email}</option>`).join("")}</select>`;
  caja.innerHTML = `<img class="logo-g" src="img/logo-cervantes.png" alt="Cervantes · Educación con futuro">
    <h1 class="centro">Registrá tu asistencia</h1>
    <p class="sub centro" style="margin-bottom:8px">${curso.materia} · División ${curso.division}.<br>
    ${real ? "En producción se entra con la cuenta de Microsoft 365. En esta prueba, completá tus datos." : "Demo: elegí un alumno del padrón ficticio."}</p>
    ${real ? formReal : formDemo}
    <button class="btn ancho" id="seguir">Registrar asistencia</button>`;
  document.getElementById("seguir").onclick = async () => {
    let alumno;
    if (real) {
      alumno = { nombre: document.getElementById("nombre").value.trim().replace(/\s+/g, " "),
        matricula: document.getElementById("matricula").value.trim(), email: document.getElementById("email").value.trim().toLowerCase() };
      const aviso = document.getElementById("aviso");
      if (alumno.nombre.length < 3) return aviso.textContent = "Escribí tu nombre y apellido.";
      if (!/^\d{3,10}$/.test(alumno.matricula)) return aviso.textContent = "La matrícula va sólo con números.";
      if (!emailValido(alumno.email)) return aviso.textContent = `El mail tiene que terminar en @${CONFIG.dominio}.`;
      try { localStorage.setItem("autopresente_alumno", JSON.stringify(alumno)); } catch {}
    } else {
      const a = alumnos.find(x => x.matricula === document.getElementById("cuenta").value);
      alumno = { nombre: a.nombre, matricula: a.matricula, email: a.email };
    }
    caja.className = "m-tarj centro";
    caja.innerHTML = `<div class="spinner"></div><h1 style="margin-top:18px">Registrando tu asistencia…</h1><p class="sub">${esc(alumno.email)}</p>`;
    const espera = new Promise(r => setTimeout(r, 1000));
    let r;
    try {
      r = local ? registrarCheckin(claseId, alumno, w, token) : await enviarCheckinRemoto(topic, claseId, alumno, w, token);
    } catch (err) {
      await espera;
      return error(err.message === "sin_respuesta" ? "La pantalla del aula no respondió" : "Sin conexión",
        (err.message === "sin_respuesta" ? "Verificá que la pantalla del aula siga abierta en la computadora."
          : "No pudimos enviar tu asistencia. Revisá que tengas internet.") +
        "<br><br><button class='btn ancho' onclick='location.reload()'>Reintentar</button>");
    }
    await espera;
    if (MENSAJES[r]) return error(...MENSAJES[r]);
    caja.innerHTML = `<div class="icono ok">✓</div><h1>¡Presente, ${esc(primerNombre(alumno.nombre))}!</h1>
      <p class="sub">${r === "repetido" ? "Ya estabas registrado/a en esta clase." : `Tu asistencia quedó registrada a las ${horaTxt(new Date())}.`}<br>
      ${curso.materia} · División ${curso.division}</p>
      <p class="detalle">${esc(alumno.email)} · Matrícula ${esc(alumno.matricula)}<br>Ya podés cerrar esta pestaña.</p>`;
  };
}
</script>
</body>
</html>
